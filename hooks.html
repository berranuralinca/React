<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
        body {
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
        }

        .send-button {
        background-color: rgb(239, 158, 52);
        color: aliceblue;
        padding: 12px 20px;
        border-radius: 10px;
        border: none;
        margin-left: 10px;
        font-size: 15px;
        cursor: pointer;
        }

        .text-input {
        padding: 12px 20px;
        border-radius: 10px;
        border-color: black;
        border-width: 2px;
        font-size: 15px;
        flex-grow: 1;
        }

        .input-div {
        display: flex;
        padding: 10px 0;
        }

        .app-div {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
        }

        .robot-div {
        display: flex;
        justify-content: start;
        align-items: start;
        }

        .user-div {
        display: flex;
        justify-content: end;
        align-items: start;
        }

        .message-div {
        background-color: rgb(237, 237, 237);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        }

        .chat-messages-div {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
        }


    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>  
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        // input message
    function ChatInput({ chatMessages, setChatMessages }) {

        // girilen değeri günceller
        const [inputText, setInputText] = React.useState("");

        function saveInputText(event) {
            setInputText(event.target.value);
        }

        function sendMessage() {

            // yeni requesti render et
            const newChatMessages =[
            ...chatMessages,
            {
                message: inputText,
                sender: "user",
                id: crypto.randomUUID()
            }
            ]

            setChatMessages(newChatMessages);

            // yeni yanıtı render et
            const response = Chatbot.getResponse(inputText);
            setChatMessages([
            ...newChatMessages,
            {
                message: response,
                sender: "robot",
                id: crypto.randomUUID()
            }
            ]);

        // en son boş değer verir
        setInputText("");
    }

    return (
        <div className="input-div">
            <input
                className ="text-input"
                placeholder="Send a message to Chatbot"
                size="30"
                value={inputText}
                onChange={saveInputText}
            />

            <button className="send-button" onClick={sendMessage}>
                Send
            </button>
        </div>
    );
    }
      
        // one message component
    function ChatMessage({message,sender}){
        // const message = props.message;
        // const sender = props.sender;
        // const {message,sender} = props;

        // if(sender === "robot"){
        //   return(
        //     <div>
        //     <img src="robot.webp" width="50"></img>
        //     {message}
        //     </div>
        // );
        // }
        
        return(
            <div className={sender==="robot"?"robot-div":"user-div"}>
              {sender==="robot" && (
                <img src="robot.webp" width="50"></img>
              )}
              <div className="message-div">
              {message}
              </div>
              {sender==="user"&&(
                <img src="user.webp" width="50"></img>
              )}
            </div>
        );
      }

      // messages componen
    function ChatMessages({ chatMessages }) {

        const chatMessagesRef = React.useRef(null);


        React.useEffect(() => {
           const cotainerElem = chatMessagesRef.current;
           if(cotainerElem){
            cotainerElem.scrollTop = cotainerElem.scrollHeight;
           }
        },[chatMessages]);

        return (
            <div className="chat-messages-div" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
                return (
                <ChatMessage
                    message={chatMessage.message}
                    sender={chatMessage.sender}
                    key={chatMessage.id}
                />
                );
            })}
            </div>
        );
    }

    function App(){
        const [chatMessages,setChatMessages] = React.useState([
            {message:"hello chatbot",
            sender:"user",
            id:"id1"},
            {
            message:"Hello!How can help you?" ,
            sender:"robot",
            id:"id2"
            },
                        {
            message:"Can you get me todays date?" ,
            sender:"user",
            id:"id3"
            },
            {
            message:"Today is August 16" ,
            sender:"robot",
            id:"id4"
            }
        ]);
        
        // const chatMessages = array[0]; //current data
        // const setChatMessages = array[1]; //updates data

        return(
        <div className="app-div">

            <ChatMessages chatMessages={chatMessages}/>

            <ChatInput 
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
            />
        
            </div>
        );
    }
      
    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
